<link rel="icon" type="image/png" href="./file_00000000f5ac8209a4f7f587b4f64aec.png"><!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10274b"><title>SH 추리 챌린지 | 6개 미션</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#eaf1ff;background:#081529}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18375c,#081529 60%);min-height:100vh}header{background:#0c203b;border-bottom:1px solid #36506f;padding:17px 18px;display:flex;justify-content:space-between;align-items:center}header b{font-size:17px}header small{color:#8bb6e6}.wrap{max-width:700px;margin:auto;padding:20px 16px 70px}.hero{margin:14px 0 24px}.eyebrow{color:#71d9d0;font-weight:800;letter-spacing:.12em;font-size:12px}h1{font-size:29px;margin:8px 0}h2{font-size:23px;margin:0 0 10px}p{line-height:1.7;color:#c9d7ed}.panel{background:#122744;border:1px solid #315172;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 12px 25px #0002}.soft{background:#1c3655;padding:14px;border-radius:12px;color:#e4efff;line-height:1.7}.muted{color:#9bb3d1;font-size:13px}.pill{display:inline-block;background:#214a6b;border:1px solid #457493;color:#b9edff;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:700}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stats span{background:#173251;border-radius:12px;padding:10px 13px;font-size:13px}.bar{height:9px;border-radius:99px;background:#2a4563;overflow:hidden;margin:12px 0 20px}.bar>div{height:100%;background:linear-gradient(90deg,#34c8bc,#75b6ff);transition:width .3s}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:14px 17px;background:#42c7ba;color:#05243b;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{width:100%;font-size:16px}.secondary{background:#254665;color:#e8f5ff}.ghost{background:transparent;border:1px solid #567596;color:#e8f5ff}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#203b59;color:#eef6ff;border:1px solid #3c5c7c;font-weight:600}.choice.selected{background:#245b70;border:2px solid #65d9c9}.choice:focus-visible,button:focus-visible{outline:3px solid #ffdb72}input,select{background:#0e223b;color:#fff;border:1px solid #52718d;padding:15px;border-radius:12px;width:100%;margin:10px 0 16px}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.result{padding:13px;border-radius:12px;margin:14px 0;line-height:1.6}.good{background:#164c48;color:#b8fff0}.bad{background:#583339;color:#ffe2df}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.step{border:1px solid #375776;background:#152d4b;border-radius:12px;padding:12px 8px;text-align:center;font-size:12px}.step.done{border-color:#39b8ac;color:#87f3e1}.step.active{background:#28506a;border-color:#8ad8ff}footer{text-align:center;color:#819bb9;font-size:12px;margin-top:35px}</style></head><body><header><b>🕵️ SH AI 탐정사무소</b><small>SH에듀컴퍼니</small></header><main class="wrap" id="app"></main><script>
const missions=[{"title": "사라진 연구자료", "tag": "관찰 · 기록 분석", "intro": "오후 3시, 미래연구실에서 파란색 연구자료 파일이 사라졌습니다. 출입 기록을 조사해 첫 단서를 찾으세요.", "evidence": "출입 기록: 민준 14:10 입실·14:20 퇴실 / 서연 14:25 입실·14:40 퇴실 / 지후 14:45 입실·14:55 퇴실. 연구원이 14:30에 파일을 책상 위에서 마지막으로 확인했습니다.", "qs": [{"q": "파일이 마지막으로 확인된 시각은?", "a": ["14:10", "14:30", "14:55"]}, {"q": "파일이 사라질 수 있었던 시간대에 연구실에 있었던 사람은?", "a": ["민준", "서연", "지후"]}, {"q": "14:30 이후 연구실에 들어온 사람은?", "a": ["민준", "서연", "지후"]}, {"q": "이 단계에서 확실하게 말할 수 있는 것은?", "a": ["서연이 범인이다", "출입 기록만으로 범인을 확정할 수 없다", "민준이 파일을 가져갔다"]}]}, {"title": "용의자 추적", "tag": "진술 비교 · 모순 찾기", "intro": "세 사람의 진술이 도착했습니다. 기록과 맞지 않는 진술을 찾아보세요.", "evidence": "민준: “나는 14:20에 나갔어.” / 서연: “나는 14:35에 연구실에 있었어.” / 지후: “나는 14:30에 연구실 안에 있었어.” 출입 기록은 미션 1과 동일합니다.", "qs": [{"q": "출입 기록과 일치하는 민준의 진술은?", "a": ["일치한다", "일치하지 않는다"]}, {"q": "서연의 진술은 기록과 일치하나요?", "a": ["일치한다", "일치하지 않는다"]}, {"q": "기록과 모순되는 진술을 한 사람은?", "a": ["민준", "서연", "지후"]}, {"q": "모순된 진술을 발견했을 때 올바른 다음 행동은?", "a": ["즉시 범인으로 확정한다", "추가 증거를 확인한다", "다른 기록을 버린다"]}]}, {"title": "비밀 암호 해독", "tag": "규칙 발견 · 암호 풀이", "intro": "연구실 서랍에서 숫자 암호 메모를 발견했습니다. 패턴을 찾아 잠금을 해제하세요.", "evidence": "메모: A=1, B=2, C=3 … Z=26. 연구원이 남긴 단어는 C-A-S-E. 별도 숫자열은 2, 4, 8, 16, ? 입니다.", "qs": [{"q": "C를 숫자로 바꾸면?", "a": ["2", "3", "4"]}, {"q": "A-S-E를 숫자로 바꾼 것은?", "a": ["1-19-5", "1-18-5", "2-19-5"]}, {"q": "숫자열 2, 4, 8, 16 다음은?", "a": ["18", "24", "32"]}, {"q": "CASE를 숫자로 변환한 정답은?", "a": ["3-1-19-5", "3-2-19-5", "4-1-19-5"]}]}, {"title": "AI가 만든 가짜 단서", "tag": "AI 리터러시 · 검증", "intro": "탐정단에 AI가 작성한 사건 요약이 도착했습니다. 원본 기록과 비교해 신뢰도를 판단하세요.", "evidence": "원본 출입 기록: 지후는 14:45 입실. AI 요약: “지후는 14:15에 입실했다.” 원본 카메라 메모: 14:50 복도에서 파란 파일을 든 사람의 얼굴은 확인되지 않음. AI 요약: “카메라가 지후의 얼굴을 확실히 식별했다.”", "qs": [{"q": "AI 요약에서 원본 기록과 다른 입실 시각은?", "a": ["14:15", "14:45", "둘 다 일치"]}, {"q": "원본 기준으로 확인된 사실은?", "a": ["지후의 얼굴이 식별되었다", "파일을 든 사람의 얼굴은 확인되지 않았다", "민준의 얼굴이 식별되었다"]}, {"q": "AI 요약과 원본이 충돌하면?", "a": ["AI 요약을 무조건 믿는다", "원본 기록을 확인한다", "둘 다 삭제한다"]}, {"q": "현재 카메라 자료만으로 특정인을 범인으로 확정할 수 있나요?", "a": ["그렇다", "아니다"]}]}, {"title": "사건의 재구성", "tag": "시간 순서 · 증거 종합", "intro": "흩어진 기록을 시간순으로 정리하면 사건의 흐름이 보입니다.", "evidence": "① 14:30 연구원이 파란 파일을 확인함. ② 14:40 서연 퇴실. ③ 14:45 지후 입실. ④ 14:50 복도에서 파란 파일을 든 신원 미상 인물이 촬영됨. ⑤ 15:00 자료 분실 신고.", "qs": [{"q": "가장 먼저 일어난 일은?", "a": ["자료 분실 신고", "연구원이 파일 확인", "복도 촬영"]}, {"q": "서연이 퇴실한 뒤 바로 기록된 일은?", "a": ["지후 입실", "자료 분실 신고", "연구원 확인"]}, {"q": "복도 촬영 시각은?", "a": ["14:30", "14:50", "15:10"]}, {"q": "현재 기록이 보여 주는 가장 타당한 결론은?", "a": ["신원 미상 인물이 촬영되었지만 신원은 미확인", "지후가 반드시 범인이다", "서연은 무조건 결백하다"]}]}, {"title": "최종 사건 보고서", "tag": "증거 판단 · 최종 추리", "intro": "마지막 증거가 공개되었습니다. 성급한 지목 대신 사실을 종합해 보고서를 완성하세요.", "evidence": "추가 확인: 연구원은 14:35에 서연에게 “파란 파일을 보관함으로 옮겨 달라”고 메시지를 보냈습니다. 서연은 14:38 보관함에 넣었다고 답했습니다. 15:05 연구원이 보관함을 확인했고 파일이 발견되었습니다. 지후의 14:30 진술은 시각을 잘못 기억한 것으로 확인되었지만, 자료를 가져간 증거는 없습니다.", "qs": [{"q": "파란 파일을 보관함으로 옮긴 사람은?", "a": ["민준", "서연", "지후"]}, {"q": "자료가 최종 발견된 장소는?", "a": ["복도", "보관함", "식당"]}, {"q": "지후의 잘못된 진술만으로 범인이라고 할 수 있나요?", "a": ["그렇다", "아니다"]}, {"q": "최종 사건 결론으로 가장 적절한 것은?", "a": ["연구원의 요청에 따른 이동을 분실로 오해한 사건", "지후의 절도 사건", "민준의 절도 사건"]}]}];

const app=document.getElementById('app');let state={team:'',token:'',mission:0,question:0,score:600,done:false,hints:{}};let choice;const STORE='sh_team_session_v2';try{Object.assign(state,JSON.parse(localStorage.getItem(STORE))||{})}catch(e){}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(STORE,JSON.stringify({team:state.team,token:state.token}))}function shell(x){app.innerHTML=x+'<footer>SH에듀컴퍼니 · SH AI 탐정사무소<br>팀별 진행 상황은 서버에 저장됩니다.</footer>'}async function api(path,body){let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error||'서버 오류');return j}function error(e){alert(e.message||'연결 오류가 발생했습니다. 다시 시도해 주세요.')}async function start(){let team=document.getElementById('team').value;try{const j=await api('join',{team});state={...j,team,token:j.token};save();render()}catch(e){error(e)}}async function refresh(){if(!state.team||!state.token)return;try{let j=await api('status',{team:state.team,token:state.token});state={...state,...j};render()}catch(e){localStorage.removeItem(STORE);state.team='';state.token='';render()}}function pick(i){choice=i;document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('selected',i===j));document.getElementById('submit').disabled=false}async function hint(){try{const j=await api('hint',{team:state.team,token:state.token});state={...state,...j};render()}catch(e){error(e)}}async function submit(){if(choice===undefined)return;try{const j=await api('answer',{team:state.team,token:state.token,answer:choice});state={...state,...j};if(j.correct){document.getElementById('feedback').innerHTML='<div class="result good">✓ 정답! '+esc(j.why)+'</div><button class="primary" onclick="next()">다음 단계 →</button>';document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('submit').disabled=true;document.getElementById('hintbtn').disabled=true}else{render();document.getElementById('feedback').innerHTML='<div class="result bad">오답입니다. 증거를 다시 확인하세요. (−10점)</div>'}}catch(e){error(e)}}async function next(){try{let j=await api('advance',{team:state.team,token:state.token});state={...state,...j};render()}catch(e){error(e)}}function render(){choice=undefined;if(!state.team){shell('<div class="hero"><div class="eyebrow">SH DETECTIVE AGENCY</div><h1>🔎 사건의 진실을 찾아라!</h1><p>6개의 미션을 해결하고 최종 사건 보고서를 완성하세요.</p></div><div class="panel"><span class="pill">40개 팀 · 6개 미션</span><h2 style="margin-top:16px">탐정단 등록</h2><label for="team">우리 팀 번호</label><select id="team"><option value="">팀 번호 선택</option>'+Array.from({length:40},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'팀</option>').join('')+'</select><button class="primary" onclick="start()">탐정 임무 시작 →</button><p class="muted">각 팀은 한 대의 대표 휴대폰을 사용하세요. 같은 팀으로 다른 기기가 접속하면 중복 진행을 방지합니다.</p></div>');return}if(state.done){shell('<div class="hero"><div class="eyebrow">CASE CLOSED</div><h1>🎉 사건 해결 완료!</h1><p>'+esc(state.team)+'팀이 6개 미션을 모두 완료했습니다.</p></div><div class="panel"><h2>최종 점수: '+state.score+' / 600점</h2><div class="soft">사건의 진실: 파란 파일은 연구원의 요청에 따라 보관함으로 옮겨졌으며, 이를 분실로 오해했습니다.</div><p>관리자 화면에도 완료 기록이 저장되었습니다.</p></div>');return}const m=missions[state.mission],q=m.qs[state.question],progress=(state.mission*4+state.question)/24*100,id=state.mission+'-'+state.question;shell('<div class="stats"><span>👥 '+esc(state.team)+'팀</span><span>🎯 미션 '+(state.mission+1)+'/6</span><span>⭐ <b id="score">'+state.score+'점</b></span></div><div class="bar"><div style="width:'+progress+'%"></div></div><div class="steps">'+missions.map((v,i)=>'<div class="step '+(i<state.mission?'done':i===state.mission?'active':'')+'">'+(i<state.mission?'✓ ':i+1+'. ')+esc(v.title)+'</div>').join('')+'</div><div class="hero"><div class="eyebrow">MISSION '+String(state.mission+1).padStart(2,'0')+' · '+esc(m.tag)+'</div><h1>'+esc(m.title)+'</h1><p>'+esc(m.intro)+'</p></div><section class="panel"><span class="pill">📂 사건 증거</span><div class="soft" style="margin-top:13px">'+esc(m.evidence)+'</div></section><section class="panel"><div class="muted">문제 '+(state.question+1)+' / 4</div><h2 style="margin-top:12px">'+esc(q.q)+'</h2>'+q.a.map((a,i)=>'<button class="choice" onclick="pick('+i+')">'+(i+1)+'. '+esc(a)+'</button>').join('')+'<div class="row"><button id="hintbtn" class="ghost" onclick="hint()">💡 힌트 (−5점)</button><button id="submit" disabled onclick="submit()">정답 제출</button></div><div id="hintbox">'+(state.hint?'<div class="result soft">💡 '+esc(state.hint)+'</div>':'')+'</div><div id="feedback" aria-live="polite">'+(state.awaitingAdvance?'<div class="result good">✓ 정답 처리되었습니다.</div><button class="primary" onclick="next()">다음 단계 →</button>':'')+'</div></section>');if(state.awaitingAdvance){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('hintbtn').disabled=true}}render();if(state.team&&state.token)refresh();
</script></body></html>
