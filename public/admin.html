</head>meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SH AI 탐정사무소 관리자</title><style>body{font-family:system-ui;background:#091a31;color:#eaf2ff;margin:0;padding:20px}main{max-width:1100px;margin:auto}input,button{padding:12px;border-radius:9px;border:1px solid #668;background:#183958;color:white;font:inherit}button{background:#39bbae;color:#09233a;font-weight:bold}table{border-collapse:collapse;width:100%;background:#132d4a}td,th{padding:10px;border-bottom:1px solid #345;text-align:center} .scroll{overflow:auto}h1{font-size:25px}#msg{color:#8ee}small{color:#abc}</style><main><h1>🕵️ SH AI 탐정사무소 · 관리자</h1><p>40개 팀 진행 현황 · 5초마다 자동 갱신</p><button onclick="load()">현황 새로고침</button><p id="msg"></p><p id="summary"></p><div class="scroll"><table><thead><tr><th>팀</th><th>상태</th><th>미션</th><th>완료 문제</th><th>점수</th><th>마지막 접속</th></tr></thead><tbody id="rows"></tbody></table></div><p><small>팀당 대표 휴대폰 1대 권장 · 서버 재배포/재시작 시 영구 디스크 미설정 환경에서는 기록이 사라질 수 있습니다.</small></p></main><script>const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){try{const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),j=await r.json();if(!r.ok)throw Error(j.error);document.getElementById('msg').textContent='마지막 갱신: '+new Date().toLocaleTimeString();document.getElementById('summary').textContent='시작 '+j.started+'팀 / 완료 '+j.completed+'팀 / 전체 40팀';document.getElementById('rows').innerHTML=j.teams.map(t=>'<tr><td>'+t.team+'팀</td><td>'+ (t.done?'완료':t.started?'진행 중':'대기')+'</td><td>'+(t.done?'6/6':t.started?t.mission+'/6':'-')+'</td><td>'+t.questions+'/24</td><td>'+t.score+'</td><td>'+e(t.updated||'-')+'</td></tr>').join('')}catch(err){document.getElementById('msg').textContent='오류: '+err.message}}load();setInterval(load,5000)</script></<link rel="icon" type="image/png" href="/파일_0000000010d082099063fdc426b98e94.png">>
